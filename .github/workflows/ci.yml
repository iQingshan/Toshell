name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  # ── 前端构建 → 同步 webdist（供 server 嵌入） ──
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: web

      - name: Build web
        run: npm run build
        working-directory: web

      - name: Sync webdist (embed target)
        run: |
          rm -rf cmd/server/webdist
          mkdir -p cmd/server/webdist
          cp -r web/dist/. cmd/server/webdist/

      - uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist

  # ── Go 服务端构建（-tags webui，嵌入前端）+ vet ──
  server:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - uses: actions/download-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist

      - name: Build server (tags webui)
        run: |
          LDFLAGS="-s -w -X main.version=1.4.0 -X main.commit=$(git rev-parse --short HEAD) -X main.buildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build -tags webui -ldflags "$LDFLAGS" -o toserver ./cmd/server

      - name: Vet
        run: go vet ./internal/server/...

      - name: Run unit tests (non-embedded)
        # 除既有基础包外，跑本版新增的纯逻辑测试：
        #   builder：构建标签矩阵 / 启动延迟模板渲染 / 默认模板不得含进程枚举 / PE 预检
        #   drivers：manifest sha256 比对、自检结论合并、JSON 字段、列表携带自检
        #   mcp    ：工具注册表形状/分级 fail-closed/默认只放行只读、结果信封与截断标注、
        #            结果外置句柄（含路径穿越拒绝）；MCP 协议层与三道限流闸（httptest，不需植入端）
        #   ai     ：Agent 工具面必须都能在注册表里找到；审批判定 fail-closed（含 delegate 越权回归）
        #   agentstore：长任务状态落盘（4 张表的 CRUD、step 恢复游标与幂等、tool_call 幂等、
        #            结果 TTL 清理、同参重复计数）—— 用临时 sqlite，Linux runner 可跑
        #   api/auth/session/webhook/avdetect：加载器链与落地建议文案、命令编码/解码、鉴权闸、
        #            会话广播、AV 识别等纯逻辑与 httptest（v1.4.0 起纳入 —— 此前 api 包不在
        #            CI 范围内，本机又被杀软拦着跑不了，结果 4 个用例红了很久没人发现）
        #   task   ：v1.4.0 S2 新增的任务终结通知原语（订阅/等待/超时/消失/等待者不泄漏）
        #            —— 事件驱动等待的地基，漏进 CI 等于没人守
        #   listener：v1.4.0 S4 新增的心跳能力位落库（心跳 Modules → 会话 ActiveModules）
        # 这些测试用桩函数替代 WinVerifyTrust、用假 Executor 替代真实会话，Linux runner 可跑。
        run: |
          go test ./internal/common/... ./internal/server/config/... \
                  ./internal/server/builder/... ./internal/server/drivers/... \
                  ./internal/server/mcp/... ./internal/server/ai/... \
                  ./internal/server/agentstore/... ./internal/server/api/... \
                  ./internal/server/auth/... ./internal/server/session/... \
                  ./internal/server/webhook/... ./internal/server/avdetect/... \
                  ./internal/server/task/... ./internal/server/listener/...
