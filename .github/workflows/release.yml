name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  # 前端构建 → 同步 webdist（供 server 嵌入）
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: web
      - name: Build web
        run: npm run build
        working-directory: web
      - name: Sync webdist
        run: |
          rm -rf cmd/server/webdist
          mkdir -p cmd/server/webdist
          cp -r web/dist/. cmd/server/webdist/
      - uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist

  # 多平台交叉编译 + 打包 + 上传 GitHub Release
  build:
    runs-on: ubuntu-latest
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe, zip: toshell-server-windows-amd64.zip, deploy: release/deploy.bat }
          - { goos: windows, goarch: '386', ext: .exe, zip: toshell-server-windows-386.zip, deploy: release/deploy.bat }
          - { goos: linux,   goarch: amd64, ext: '', zip: toshell-server-linux-amd64.zip, deploy: release/deploy.sh }
          - { goos: linux,   goarch: arm64, ext: '', zip: toshell-server-linux-arm64.zip, deploy: release/deploy.sh }
          - { goos: darwin,  goarch: amd64, ext: '', zip: toshell-server-darwin-amd64.zip, deploy: release/deploy.sh }
          - { goos: darwin,  goarch: arm64, ext: '', zip: toshell-server-darwin-arm64.zip, deploy: release/deploy.sh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Build server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          LDFLAGS="-s -w -X main.version=1.3.0 -X main.commit=$(git rev-parse --short HEAD) -X main.buildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build -tags webui -ldflags "$LDFLAGS" -o "toserver${{ matrix.ext }}" ./cmd/server

      - name: Package zip
        run: |
          mkdir -p pkg
          cp "toserver${{ matrix.ext }}" "pkg/toserver${{ matrix.ext }}"
          # 完整可运行包：植入端模板 + 配置样例 + 依赖目录
          cp -r release/implant pkg/implant
          cp -r release/implant_c pkg/implant_c
          # 配置：与 release/configs 布局一致（deploy.sh/bat 从 configs/ 读取）
          mkdir -p pkg/configs
          cp configs/server.yaml.example pkg/configs/server.yaml.example
          cp README.md pkg/README.md
          cp USAGE.md pkg/USAGE.md
          cp "${{ matrix.deploy }}" pkg/
          # 运行时数据预设：data 目录 + 杀软指纹库（服务端必需，db 由首次启动自动创建）
          mkdir -p pkg/data
          cp data/av_fingerprints.json pkg/data/av_fingerprints.json
          # upx/drivers/plugins 若存在于仓库则一并打包（可选依赖）
          for d in upx drivers plugins; do if [ -d "release/$d" ]; then cp -r "release/$d" "pkg/$d"; fi; done
          if [ "${{ matrix.goos }}" != "windows" ]; then chmod +x pkg/deploy.sh; fi
          (cd pkg && zip -q -r "../${{ matrix.zip }}" .)

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip }}
          generate_release_notes: true
