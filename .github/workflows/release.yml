name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  # 前端构建 → 同步 webdist（供 server 嵌入）
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: web
      - name: Build web
        run: npm run build
        working-directory: web
      - name: Sync webdist
        run: |
          rm -rf cmd/server/webdist
          mkdir -p cmd/server/webdist
          cp -r web/dist/. cmd/server/webdist/
      - uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist

  # ── 发版门禁：端到端冒烟（打包发布前必须通过）──────────────────────────
  # 覆盖历史事故：改动后忘重编服务端、模板档位构建失败、接口路由/鉴权失效。
  # 托管 runner 上不跑真实植入端（未签名载荷会被托管杀软拦），故固定 -SkipImplant。
  e2e-smoke:
    runs-on: windows-latest
    needs: web
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true
      - name: Prefetch implant toolchain (Go 1.20.14)
        shell: powershell
        run: |
          $env:GOTOOLCHAIN = 'go1.20.14'
          go version
      - name: E2E smoke (server build + 3 payload flavors + auth + routes)
        # 用 Windows PowerShell 5.1 跑：脚本是按 5.1 语义编写与静态校验的
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\e2e_smoke.ps1 -SkipImplant -KeepArtifacts
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-artifacts
          path: ${{ runner.temp }}\toshell-e2e-*
          if-no-files-found: ignore
          retention-days: 7

  # 多平台交叉编译 + 打包 + 上传 GitHub Release
  build:
    runs-on: ubuntu-latest
    needs: [ web, e2e-smoke ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe, zip: toshell-server-windows-amd64.zip, deploy: release/deploy.bat }
          - { goos: windows, goarch: '386', ext: .exe, zip: toshell-server-windows-386.zip, deploy: release/deploy.bat }
          - { goos: linux,   goarch: amd64, ext: '', zip: toshell-server-linux-amd64.zip, deploy: release/deploy.sh }
          - { goos: linux,   goarch: arm64, ext: '', zip: toshell-server-linux-arm64.zip, deploy: release/deploy.sh }
          - { goos: darwin,  goarch: amd64, ext: '', zip: toshell-server-darwin-amd64.zip, deploy: release/deploy.sh }
          - { goos: darwin,  goarch: arm64, ext: '', zip: toshell-server-darwin-arm64.zip, deploy: release/deploy.sh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Build server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME#v} -X main.commit=$(git rev-parse --short HEAD) -X main.buildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build -tags webui -ldflags "$LDFLAGS" -o "toserver${{ matrix.ext }}" ./cmd/server

      - name: Package zip
        run: |
          # 暂存目录必须用仓库里不存在的名字：以前用 pkg/，而仓库本身有 pkg/goroutine、
          # pkg/rate 两个源码目录，导致它们被一起打进发布 zip。
          STAGE="pkgstage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp "toserver${{ matrix.ext }}" "$STAGE/toserver${{ matrix.ext }}"
          # 完整可运行包：植入端模板 + 配置样例 + 依赖目录
          cp -r release/implant "$STAGE/implant"
          cp -r release/implant_c "$STAGE/implant_c"
          # 配置：与 release/configs 布局一致（deploy.sh/bat 从 configs/ 读取）
          mkdir -p "$STAGE/configs"
          cp configs/server.yaml.example "$STAGE/configs/server.yaml.example"
          cp README.md "$STAGE/README.md"
          cp USAGE.md "$STAGE/USAGE.md"
          # 文档目录必须随包分发：README/USAGE 里大量链接指向 docs/EVASION.md、
          # docs/LOADERS.md、docs/DEPLOY-DOMAIN-CDN.md，不打包就是一堆死链
          # （README 里的截图也在 docs/screenshots/ 下）。
          cp -r docs "$STAGE/docs"
          # 许可与第三方声明：包里捆绑了 UPX(GPL) 与第三方签名驱动，必须随包分发
          cp LICENSE "$STAGE/LICENSE"
          cp DISCLAIMER.md "$STAGE/DISCLAIMER.md"
          cp THIRD-PARTY-NOTICES.md "$STAGE/THIRD-PARTY-NOTICES.md"
          cp "${{ matrix.deploy }}" "$STAGE/"
          # 一键部署脚本（傻瓜式：环境检测 + 按需在线安装 + 直接启动打包好的服务端）
          cp release/install.sh "$STAGE/"
          cp release/install.ps1 "$STAGE/"
          # 运行时数据预设：data 目录 + 杀软指纹库（服务端必需，db 由首次启动自动创建）
          mkdir -p "$STAGE/data"
          cp data/av_fingerprints.json "$STAGE/data/av_fingerprints.json"
          # upx/drivers/plugins 若存在于仓库则一并打包（可选依赖）
          for d in upx drivers plugins; do if [ -d "release/$d" ]; then cp -r "release/$d" "$STAGE/$d"; fi; done
          if [ "${{ matrix.goos }}" != "windows" ]; then chmod +x "$STAGE/deploy.sh"; fi
          (cd "$STAGE" && zip -q -r "../${{ matrix.zip }}" .)
          rm -rf "$STAGE"

      - name: Verify version matches tag (linux/amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          chmod +x toserver
          out=$(./toserver -version 2>&1 || true)
          echo "$out"
          want="${GITHUB_REF_NAME#v}"
          echo "$out" | grep -q "$want" || { echo "::error::built binary reports a version that does not match tag $GITHUB_REF_NAME (want $want)"; exit 1; }

      - name: Verify package layout
        run: |
          # 包里必须带上"能直接跑起来"的最小集合（历史事故：漏了 implant 模板或配置样例），
          # 以及 README/USAGE 里链到的文档（docs/ 不打包就会在包内变成死链）。
          unzip -l "${{ matrix.zip }}" > /tmp/ziplist.txt
          cat /tmp/ziplist.txt
          for f in "toserver${{ matrix.ext }}" "implant/main.go" "configs/server.yaml.example" "README.md" "USAGE.md" "LICENSE" "docs/EVASION.md" "docs/LOADERS.md"; do
            grep -q "$f" /tmp/ziplist.txt || { echo "::error::package is missing $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
          if-no-files-found: error

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip }}
          # 版本号跟随 tag（v1.4.x）；标题也用 tag 名
          name: ${{ github.ref_name }}
          # 固定正文：不要用 generate_release_notes —— 它会在每次重跑（多平台矩阵 / 重打 tag）
          # 时重复追加一行 "Full Changelog: ..."，导致正文被刷屏。
          body: |
            Toshell ${{ github.ref_name }}

            使用前请修改配置文件，安装go和相关go类库。

            更新日志：[更新日志](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            项目介绍：[项目介绍](https://github.com/${{ github.repository }}/blob/main/README.md)

            使用说明：[使用说明](https://github.com/${{ github.repository }}/blob/main/USAGE.md)

            Bug或者建议请提交issue。

  # 全部 zip 汇总后生成校验清单（sha256），随 Release 一起发布。
  # 单独一个 job 是因为矩阵里每个 job 只知道自己那一个 zip。
  checksums:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 必须先 checkout：下面 files 里要补发的 LICENSE/DISCLAIMER/THIRD-PARTY-NOTICES
      # 都在仓库里，不 checkout 就会被 softprops 静默跳过（v1.3.4/1.3.5 实测如此）。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd dist
          # 只对发布 zip 求哈希，顺序固定便于比对
          ls -1 *.zip | sort | xargs sha256sum > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          # 只补发 checksums.txt + 许可与声明（不传 name/body，避免覆盖已写好的 Release 标题与正文）。
          # 这三个文件由单个 job 上传（矩阵里每个 job 都传会并发冲突）。
          files: |
            dist/checksums.txt
            LICENSE
            DISCLAIMER.md
            THIRD-PARTY-NOTICES.md
